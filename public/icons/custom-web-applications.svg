<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      .icon-stroke {
        fill: none;
        stroke: #4ecdc4;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon-stroke-white {
        fill: none;
        stroke: #ffffff;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!-- Browser Icon -->
  <g transform="translate(30, 40)">
    <rect x="0" y="0" width="140" height="100" rx="8" class="icon-stroke-white" />
    <line x1="0" y1="25" x2="140" y2="25" class="icon-stroke-white" />
    <circle cx="12" cy="12" r="2.5" fill="#ffffff" />
    <circle cx="25" cy="12" r="2.5" fill="#ffffff" />
    <circle cx="38" cy="12" r="2.5" fill="#ffffff" />

    <!-- Code brackets -->
    <path d="M40 50 L25 65 L40 80" class="icon-stroke" />
    <path d="M100 50 L115 65 L100 80" class="icon-stroke" />
    <line x1="70" y1="48" x2="70" y2="82" class="icon-stroke" />
  </g>
</svg>
