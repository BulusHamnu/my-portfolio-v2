<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Monitor / Screen Outline -->
    <rect x="25" y="20" width="150" height="110" rx="8" stroke="#4ecdc4" stroke-width="2"/>
    <!-- Monitor Stand -->
    <path d="M75 130 L75 145 M125 130 L125 145 M50 145 L150 145" stroke="#4ecdc4" stroke-width="2"/>

    <!-- Analytics: Bar Chart inside monitor -->
    <rect x="50" y="85" width="16" height="28" rx="2" stroke="#ffffff" stroke-width="1.8"/>
    <rect x="80" y="65" width="16" height="48" rx="2" stroke="#ffffff" stroke-width="1.8"/>
    <rect x="110" y="50" width="16" height="63" rx="2" stroke="#ffffff" stroke-width="1.8"/>

    <!-- Analytics: Line Graph inside monitor -->
    <path d="M50 83 L80 63 L110 48 L140 75 L160 35" stroke="#4ecdc4" stroke-width="1.8"/>
    <!-- Data points on line graph -->
    <circle cx="140" cy="75" r="2.5" fill="#4ecdc4" stroke="none"/>
    <circle cx="160" cy="35" r="2.5" fill="#4ecdc4" stroke="none"/>
  </g>
</svg>
