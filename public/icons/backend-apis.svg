<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <!-- Server / API nodes icon -->
  <g stroke="#4ecdc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top node / Server -->
    <rect x="65" y="20" width="70" height="32" rx="4" />
    <circle cx="82" cy="36" r="2.5" fill="#4ecdc4" />
    <line x1="95" y1="36" x2="120" y2="36" />

    <!-- Bottom left node / Server -->
    <rect x="15" y="100" width="70" height="32" rx="4" />
    <circle cx="32" cy="116" r="2.5" fill="#4ecdc4" />
    <line x1="45" y1="116" x2="70" y2="116" />

    <!-- Bottom right node / Server -->
    <rect x="115" y="100" width="70" height="32" rx="4" />
    <circle cx="132" cy="116" r="2.5" fill="#4ecdc4" />
    <line x1="145" y1="116" x2="170" y2="116" />

    <!-- Connection lines with data flow arrows -->
    <!-- Top to bottom-left -->
    <path d="M 75 52 L 45 100" />
    <polyline points="48,88 45,100 58,96" />

    <!-- Top to bottom-right -->
    <path d="M 125 52 L 155 100" />
    <polyline points="142,96 155,100 152,88" />

    <!-- Bottom-left to bottom-right -->
    <path d="M 85 116 L 115 116" />
    <polyline points="105,110 115,116 105,122" />
  </g>
</svg>
